services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexoclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexoclinic_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexoclinic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://nexoclinic:nexoclinic_dev_password@postgres:5432/nexoclinic?schema=public
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-deployment}
      API_PORT: 3000
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
